name: TONIGHT public TVmaze index
on:
  push:
    branches: [tonight-public-source-collection-20260911]
    paths: [.github/workflows/tonight-public-tvmaze-index.yml]
permissions: {}
concurrency:
  group: tonight-public-tvmaze-index
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Read bounded public index without credentials
        shell: python
        run: |
          import datetime, gzip, hashlib, json, pathlib, time, urllib.request, urllib.error
          out = pathlib.Path('public-tvmaze'); out.mkdir()
          receipts = []; seen = set(); completed = False; terminal_status = None
          start = time.monotonic()
          try:
              with gzip.open(out / 'show-index.jsonl.gz', 'wt', encoding='utf-8', compresslevel=6) as stream:
                  for page in range(800):
                      if time.monotonic() - start > 900:
                          raise TimeoutError('15 minute collection limit reached')
                      url = 'https://api.tvmaze.com/shows?page=' + str(page)
                      req = urllib.request.Request(url, headers={'User-Agent': 'TONIGHT-public-metadata-audit/1.0'})
                      try:
                          with urllib.request.urlopen(req, timeout=25) as response:
                              raw = response.read(2000001)
                              if len(raw) > 2000000:
                                  raise ValueError('page exceeds 2 MB response limit')
                              record = {'url': url, 'status': response.status, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'retrieved_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'last_modified': response.headers.get('Last-Modified')}
                      except urllib.error.HTTPError as exc:
                          terminal_status = exc.code
                          if exc.code == 404:
                              completed = True
                              break
                          raise
                      shows = json.loads(raw)
                      if not isinstance(shows, list):
                          raise ValueError('expected a public show list')
                      record['records'] = len(shows); receipts.append(record)
                      for show in shows:
                          ident = show.get('id')
                          if not isinstance(ident, int) or ident in seen:
                              raise ValueError('invalid or duplicate show identifier')
                          seen.add(ident)
                          stream.write(json.dumps({'page': page, 'record': show}, ensure_ascii=False, separators=(',', ':')) + '\n')
                      if page % 25 == 0:
                          print(json.dumps({'page': page, 'records': len(seen)}), flush=True)
                      time.sleep(0.8)
          finally:
              result = {'source': 'TVmaze public API', 'documentation': 'https://www.tvmaze.com/api', 'license': 'CC BY-SA 4.0', 'public_index_completed': completed, 'terminal_http_status': terminal_status, 'records': len(seen), 'pages': receipts, 'private_input': False, 'numeric_film_profiles_created': 0}
              path = out / 'show-index.jsonl.gz'
              if path.exists():
                  result['file_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
                  result['file_bytes'] = path.stat().st_size
              (out / 'receipt.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
              (out / 'ATTRIBUTION.txt').write_text('TVmaze public show metadata, retrieved for source research. CC BY-SA 4.0. Source: https://www.tvmaze.com/api . Per-record source URLs are retained. This is not streaming access information or a verified F01-F18 assessment.', encoding='utf-8')
              print('TONIGHT_TVMAZE_RESULT=' + json.dumps({k:v for k,v in result.items() if k != 'pages'}), flush=True)
          if not completed:
              raise SystemExit('The full public index was not completed.')
      - name: Preserve source records and receipt for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tonight-public-tvmaze-index
          path: public-tvmaze/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
