name: TONIGHT public CMU archive download
on:
  push:
    branches: [tonight-public-source-collection-20260911]
    paths: [.github/workflows/tonight-public-cmu-download.yml]
permissions: {}
concurrency:
  group: tonight-public-cmu-download
  cancel-in-progress: true
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download only the official public corpus, without extraction
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, time, urllib.request
          directory = pathlib.Path('public-cmu'); directory.mkdir()
          url = 'https://www.cs.cmu.edu/~ark/personas/data/corenlp_plot_summaries.tar'
          request = urllib.request.Request(url, headers={'User-Agent': 'TONIGHT-public-corpus-research/1.0', 'Accept-Encoding': 'identity'})
          h = hashlib.sha256(); total = 0; start = time.monotonic()
          path = directory / 'corenlp_plot_summaries.tar'
          with urllib.request.urlopen(request, timeout=60) as response, path.open('wb') as output:
              receipt = {'url': url, 'status': response.status, 'last_modified': response.headers.get('Last-Modified'), 'content_length': response.headers.get('Content-Length'), 'retrieved_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              while True:
                  if time.monotonic() - start > 480:
                      raise TimeoutError('Eight minute download limit reached')
                  block = response.read(1048576)
                  if not block:
                      break
                  total += len(block)
                  if total > 900000000:
                      raise ValueError('Official corpus exceeds the bounded 900 MB limit')
                  output.write(block); h.update(block)
          if receipt['content_length'] and int(receipt['content_length']) != total:
              raise ValueError('Incomplete archive download')
          receipt.update({'bytes': total, 'sha256': h.hexdigest(), 'download_completed': True, 'archive_extracted': False, 'code_executed_from_archive': False, 'private_inputs': False, 'numeric_f_profiles_created': 0, 'source_documentation': 'https://www.cs.cmu.edu/~ark/personas/', 'license': 'CC BY-SA, as specified by the publisher'})
          (directory / 'receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print('TONIGHT_CMU_DOWNLOAD_RESULT=' + json.dumps(receipt), flush=True)
      - name: Retain official source archive for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tonight-public-cmu-archive
          path: public-cmu/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
